# ─────────────────────────────────────────────────────────────────────────────
# Fe_H2_asymmetric_hydrogenation.yaml
# Configuration for iron-catalyzed asymmetric H2 hydrogenation.
# Inherits from base_config.yaml; values here take priority.
# ─────────────────────────────────────────────────────────────────────────────

metal:
  name: Iron
  symbol: Fe
  aliases:
    - iron
    - fe
    - "iron(ii)"
    - "iron(iii)"
    - "fe(ii)"
    - "fe(iii)"
  # Regex used for metal detection in text (Python re syntax)
  regex: '\b(?:iron(?:\(ii\)|\(iii\))?|fe(?:\(ii\)|\(iii\))?)\b'

project:
  name: Fe_H2_Asymmetric_Hydrogenation
  description: >
    Systematic literature mapping of iron-catalyzed asymmetric molecular-H2
    hydrogenation. Covers enantioselective reactions using Fe complexes and
    chiral ligands with H2 as the sole reductant.

output:
  prefix: Fe_H2
  master_excel: Fe_H2_Master_Literature.xlsx
  screened_excel: Fe_H2_Title_Abstract_Screened.xlsx
  strict_h2_excel: Fe_H2_Strict_H2_Only.xlsx
  fulltext_excel: Fe_H2_Fulltext_Screening.xlsx
  extraction_excel: Fe_H2_Reaction_Data.xlsx
  download_log_excel: Fe_H2_Download_Log.xlsx
  data_subdir: data/Fe_H2

search:
  query_groups:
    "A. Direct Fe asymmetric hydrogenation":
      - "iron-catalyzed asymmetric hydrogenation"
      - "iron-catalysed asymmetric hydrogenation"
      - "Fe-catalyzed asymmetric hydrogenation"
      - "Fe-catalysed asymmetric hydrogenation"
    "B. Enantioselective wording":
      - "iron-catalyzed enantioselective hydrogenation"
      - "Fe-catalyzed enantioselective hydrogenation"
      - "chiral iron catalyst hydrogenation"
      - "iron catalyst enantioselective hydrogenation H2"
    "C. Molecular hydrogen restriction":
      - "iron asymmetric hydrogenation molecular hydrogen"
      - "Fe asymmetric hydrogenation H2"
      - "iron catalyst molecular hydrogen enantioselective"
      - "iron hydrogenation ee H2"
    "D. Review discovery":
      - "review iron asymmetric hydrogenation"
      - "review iron-catalyzed enantioselective hydrogenation"
      - "base metal asymmetric hydrogenation review"
      - "earth-abundant metal asymmetric hydrogenation review"

screening:
  # Fe-specific additional exclusions (on top of universal_exclusion_terms)
  metal_exclusion_terms: []
  # Other-metal regex to detect wrong-metal papers
  other_metal_regex: >
    \b(?:nickel|ni[-\s]?catalyzed|ruthenium|ru[-\s]?catalyzed|iridium|
    ir[-\s]?catalyzed|rhodium|rh[-\s]?catalyzed|cobalt|co[-\s]?catalyzed|
    manganese|mn[-\s]?catalyzed|palladium|pd[-\s]?catalyzed)\b
