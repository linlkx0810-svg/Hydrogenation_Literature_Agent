name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run regression tests
        run: pytest -q

      - name: Run deterministic extraction benchmark
        run: python tools/run_benchmark.py --dataset examples/benchmark_synthetic.jsonl

      - name: Run evidence-verifier trust benchmark
        run: python tools/run_trust_benchmark.py --dataset examples/benchmark_synthetic.jsonl


      - name: Dry-run the Raw LLM chain (no model call)
        run: |
          python agent.py extract-raw --input examples/raw_chain_sample.txt             --source-id CI-SAMPLE --output raw_requests.json

      - name: Replay the Raw LLM chain and freeze raw predictions
        run: |
          python agent.py extract-raw --input examples/raw_chain_sample.txt             --source-id CI-SAMPLE --replay examples/raw_llm_replay_example.jsonl             --model replay-json --output raw_predictions.jsonl
          python tools/freeze_raw_predictions.py --predictions raw_predictions.jsonl             --out raw_predictions.freeze.json
          python tools/freeze_raw_predictions.py --predictions raw_predictions.jsonl             --out raw_predictions.freeze.json --verify

      - name: Smoke-test unified agent CLI
        run: |
          python agent.py benchmark --dataset examples/benchmark_synthetic.jsonl
          python agent.py trust-benchmark --dataset examples/benchmark_synthetic.jsonl
