name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run regression tests
        run: pytest -q

      - name: Run deterministic extraction benchmark
        run: python tools/run_benchmark.py --dataset examples/benchmark_synthetic.jsonl

      - name: Smoke-test unified agent CLI
        run: python agent.py benchmark --dataset examples/benchmark_synthetic.jsonl

      - name: Smoke-test LLM extractor replay contract
        run: |
          python agent.py llm-extract-replay \
            --input examples/evidence_chunk_synthetic.txt \
            --response examples/llm_response_synthetic.json \
            --model-name ci-replay-model

      - name: Smoke-test verifier replay contract
        run: |
          python agent.py verify-replay \
            --candidate examples/verifier_candidate_synthetic.json \
            --responses examples/verifier_responses_synthetic.json \
            --model-name ci-replay-verifier

      - name: Run development benchmark contract
        run: python tools/run_development_benchmark.py --json
